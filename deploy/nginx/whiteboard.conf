# Nginx site for the whiteboard (template).
# Install with: ./deploy/production.sh nginx-install
# Requires beforehand:
#   - certs at /etc/letsencrypt/live/<domain>/  (certbot)
#   - websocket map: written automatically to /etc/nginx/conf.d/websocket-map.conf
#   - upstream: managed by deploy/production.sh in /etc/nginx/conf.d/whiteboard-upstream.conf
#
# NOTE: proxy_pass points at the `whiteboard_app` upstream, NOT a fixed port -
# that indirection is what makes blue-green zero-downtime switches possible.

# Flood protection for static assets and cheap connection backstops.
# Deliberately generous: a university can put ~100 active users behind one
# NAT IP, so per-IP zones must never throttle legitimate lecture traffic.
limit_req_zone $binary_remote_addr zone=wb_static:16m rate=120r/s;
limit_conn_zone $binary_remote_addr zone=wb_conn:16m;

server {
    listen 80;
    server_name __WHITEBOARD_DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` (а не `http2 on;`): работает на nginx 1.18 (Ubuntu
    # 22.04) и новее - отдельная директива `http2 on;` появилась только в 1.25
    # и валит nginx -t на старых версиях.
    listen 443 ssl http2;
    server_name __WHITEBOARD_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__WHITEBOARD_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__WHITEBOARD_DOMAIN__/privkey.pem;

    # Backstop only (300 concurrent conns/IP) - catches raw socket floods,
    # not real classes. App-level rate limits do the fine-grained work.
    limit_conn wb_conn 300;

    # Long-lived Socket.IO connections
    location / {
        proxy_pass http://whiteboard_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite instead of $proxy_add_x_forwarded_for: client-supplied
        # XFF prefixes are attacker-controlled noise; the app trusts exactly
        # one hop (this nginx) via uvicorn --forwarded-allow-ips.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /static/ {
        limit_req zone=wb_static burst=240 nodelay;
        proxy_pass http://whiteboard_app;
        proxy_set_header Host $host;
        expires 1h;
    }

    location /uploads/ {
        limit_req zone=wb_static burst=60 nodelay;
        proxy_pass http://whiteboard_app;
        proxy_set_header Host $host;
    }
}
